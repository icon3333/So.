<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Einstellungen · So.</title>
  <link rel="stylesheet" href="/settings.css">
  <script src="/settings.js" defer></script>
</head>
<body>
  <main>
    <header class="site-header">
      <a href="/">← Arbeitsliste</a>
    </header>
    <section class="intro" aria-labelledby="page-title">
      <p class="eyebrow">So. / Einstellungen</p>
      <h1 id="page-title">Integration</h1>
    </section>
    <ul id="integrations" class="integrations" aria-label="Konten und Importquellen" aria-live="polite">
      <li>Integrationen werden geladen …</li>
    </ul>
    <aside class="note">
      <h2>Importe und Hermes</h2>
      <p>Importquellen lesen Inhalte in diese lokale Liste ein. Sie verbinden Hermes nicht automatisch. Hermes erhält nur Text, den du nach Prüfung manuell kopierst oder teilst.</p>
    </aside>

  </main>
  <dialog id="provider-dialog" aria-labelledby="dialog-title">
    <form id="provider-form">
      <button type="button" class="close" aria-label="Schließen">×</button>
      <p class="eyebrow">VERBINDUNG VERWALTEN</p>
      <h2 id="dialog-title"></h2>
      <p id="dialog-message"></p>
      <div id="provider-fields"></div>
      <p id="action-status" role="status" aria-live="polite"></p>
      <div class="actions">
        <button type="button" data-action="test">Verbindung testen</button>
        <button type="button" class="primary" data-action="connect">Verbinden</button>
      </div>
    </form>
  </dialog>
</body>
</html>
